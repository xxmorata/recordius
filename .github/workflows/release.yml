# Builds the macOS app and attaches it to a GitHub release whenever a `v*` tag is pushed.
#   git tag v1.0.1 && git push origin v1.0.1
name: Release desktop app

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    env:
      HAS_SIGNING_CERT: ${{ secrets.MAC_SIGNING_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check that the tag matches desktop/package.json
        run: |
          V=$(node -p "require('./desktop/package.json').version")
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package version v$V"; exit 1; }
      - run: npm ci
        working-directory: desktop
      - name: Import signing certificate
        # Optional. A self-signed certificate is enough: it keeps macOS privacy permissions stable
        # across updates (see docs/desktop.md). Without the secrets the build is ad-hoc signed.
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          MAC_SIGNING_P12: ${{ secrets.MAC_SIGNING_P12 }}
          MAC_SIGNING_P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/recordius-signing.keychain-db"
          echo "$MAC_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$MAC_SIGNING_P12_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$MAC_SIGNING_P12_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$MAC_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MAC_SIGNING_P12_PASSWORD" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          echo "RECORDIUS_SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - run: node scripts/package.mjs --release --no-install
        working-directory: desktop
        env:
          # Ed25519 key that signs the app code; installed apps refuse in-app updates without a valid signature.
          RECORDIUS_UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      - name: Check that the update payload is signed
        run: tar -tzf desktop/dist/release/recordius-app-*.tar.gz | grep -qx './manifest.sig' || { echo "the in-app update isn't signed — set the UPDATE_SIGNING_KEY secret"; exit 1; }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/release/*
          generate_release_notes: true
