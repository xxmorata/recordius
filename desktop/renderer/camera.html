<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' mediastream: blob:" />
    <title>Recordius camera</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body { padding: 24px; }
      .bubble { position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #1b1b21; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3), 0 0 0 3px #fff; -webkit-app-region: drag; }
      video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
      .sizes { position: absolute; left: 50%; bottom: 9%; transform: translateX(-50%); display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; -webkit-app-region: no-drag; }
      body:hover .sizes { opacity: 1; }
      .sizes button { width: 26px; height: 26px; border-radius: 50%; background: rgba(25, 28, 38, 0.7); color: #fff; font-size: 10px; font-weight: 700; }
      .sizes button:hover { background: var(--brand); }
      .err { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 11px; text-align: center; padding: 22%; }
    </style>
  </head>
  <body>
    <div class="bubble">
      <video id="v" autoplay muted playsinline></video>
      <div class="err" id="err" hidden></div>
      <div class="sizes"><button data-size="s">S</button><button data-size="m">M</button><button data-size="l">L</button></div>
    </div>
    <script src="camera.js"></script>
  </body>
</html>
